version: 2.1

jobs:
  build-image:
    docker:
      - image: cimg/base:2026.10
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t debian-mail-overlay:${CIRCLE_SHA1} .

workflows:
  build:
    jobs:
      - build-image
